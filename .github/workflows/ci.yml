name: Build, Package & Auto-Release

on:
  push:
    branches: [ main, windows ]
  pull_request:
    branches: [ main, windows ]

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (.deb)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from CMakeLists.txt
        id: version
        run: |
          VER=$(grep -m1 'set(CPACK_PACKAGE_VERSION' CMakeLists.txt \
                | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER"    >> "$GITHUB_OUTPUT"
          echo "Detected version: $VER"

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            cmake \
            pkg-config \
            libavformat-dev \
            libavcodec-dev \
            libavutil-dev \
            libswscale-dev \
            libsdl2-dev \
            libgtk-3-dev \
            libx11-dev \
            libxfixes-dev \
            libxext-dev \
            dpkg-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compile WallScape
        run: cmake --build build --config Release -- -j$(nproc)

      - name: Build Debian (.deb) Package
        run: |
          cd build
          cpack -G DEB
          ls -lh *.deb

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wallscape-linux-deb
          path: build/*.deb

  build-windows:
    name: Build Windows 11 (NSIS & ZIP)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-nsis

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-O2 -Wall"

      - name: Compile WallScape for Windows
        shell: msys2 {0}
        run: |
          cmake --build build --config Release

      - name: Package Windows Installer & ZIP
        shell: msys2 {0}
        run: |
          cd build
          cpack -G "ZIP;NSIS"
          ls -lh

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wallscape-windows-packages
          path: |
            build/wallscape-*.exe
            build/wallscape-*.zip

  publish-release:
    name: Publish Release (Linux & Windows)
    needs: [build-linux, build-windows]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/windows')
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from CMakeLists.txt
        id: version
        run: |
          VER=$(grep -m1 'set(CPACK_PACKAGE_VERSION' CMakeLists.txt \
                | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER"    >> "$GITHUB_OUTPUT"

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: wallscape-linux-deb
          path: release-assets/

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: wallscape-windows-packages
          path: release-assets/

      - name: Extract Release Notes from CHANGELOG
        run: |
          python3 -c "
          import re
          ver = '${{ steps.version.outputs.version }}'
          try:
              with open('CHANGELOG.md', 'r') as f:
                  content = f.read()
              m = re.search(r'##\s*\[?' + re.escape(ver) + r'\]?.*?\n(.*?)(?=\n##|\Z)', content, re.DOTALL)
              if m and m.group(1).strip():
                  notes = m.group(1).strip()
              else:
                  notes = '• WallScape Windows 11 & Linux Release.'
          except Exception as e:
              notes = '• WallScape Windows 11 & Linux Release.'
          with open('/tmp/release_notes.md', 'w') as f:
              f.write(notes + '\n')
          "

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "WallScape ${{ steps.version.outputs.tag }}"
          body_path: /tmp/release_notes.md
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
