name: Release on Manual Tag

# This workflow is a fallback for manual releases via:
#   git tag v1.2.0 && git push origin v1.2.0
#
# Automatic releases on push to main are handled by ci.yml, which reads the
# version from CMakeLists.txt and creates both the tag and the GitHub Release.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            cmake \
            pkg-config \
            libavformat-dev \
            libavcodec-dev \
            libavutil-dev \
            libswscale-dev \
            libsdl2-dev \
            libgtk-3-dev \
            libx11-dev \
            libxfixes-dev \
            libxext-dev \
            dpkg-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build WallScape
        run: cmake --build build --config Release -- -j$(nproc)

      - name: Build Debian (.deb) Package
        run: |
          cd build
          cpack -G DEB

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
