<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b8cff"/>
      <stop offset="100%" stop-color="#8a5bff"/>
    </linearGradient>
  </defs>

  <!-- App icon background -->
  <rect width="512" height="512" rx="108" fill="#181a22"/>

  <!-- Back card (still image, most rotated) -->
  <rect x="0" y="0" width="220" height="150" rx="20"
        fill="#3a3d52"
        transform="translate(196,291) rotate(-16) translate(-110,-75)"/>

  <!-- Middle card (still image) -->
  <rect x="0" y="0" width="220" height="150" rx="20"
        fill="#565a78"
        transform="translate(256,256) rotate(-6) translate(-110,-75)"/>

  <!-- Front card (active / video wallpaper) -->
  <rect x="0" y="0" width="240" height="164" rx="22"
        fill="url(#front)"
        transform="translate(346,224) rotate(6) translate(-120,-82)"/>

  <!-- Play triangle on front card -->
  <g transform="translate(346,224) rotate(6)">
    <circle cx="0" cy="0" r="34" fill="#ffffff" opacity="0.16"/>
    <polygon points="-12,-18 -12,18 20,0" fill="#ffffff"/>
  </g>
</svg>
